name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck

  test:
    name: Test on Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        os: [ubuntu-latest]
        include:
          # The CLI walks directories and starts worker threads, so it is worth
          # proving on the other two platforms as well.
          - node: 22
            os: windows-latest
          - node: 22
            os: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit and integration tests
        run: npm test

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exports, types and manifest
        run: npm run package:check
      - name: Build the tarball
        run: npm pack
      - name: Install the tarball into a clean project and use it
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/pdf-a11y-*.tgz
          node -e "
            const { checkPdf, CHECK_IDS } = require('pdf-a11y');
            if (!CHECK_IDS.includes('figure-alt')) { throw new Error('missing checks'); }
            checkPdf(new Uint8Array([1,2,3])).then(r => {
              if (!r.readError) { throw new Error('expected a read error'); }
              console.log('CJS consumer ok');
            });
          "
          node --input-type=module -e "
            import { checkPdf } from 'pdf-a11y';
            const r = await checkPdf(new Uint8Array([1,2,3]));
            if (!r.readError) { throw new Error('expected a read error'); }
            console.log('ESM consumer ok');
          "
          npx --no-install pdf-a11y --version
      - uses: actions/upload-artifact@v5
        with:
          name: tarball
          path: "*.tgz"
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production dependencies must have no known advisories
        run: npm audit --omit=dev --audit-level=low
      # Development dependencies cannot reach a published artifact, but a high
      # or critical advisory in the toolchain is still worth stopping for.
      - name: Development dependencies must have no high or critical advisories
        run: npm audit --audit-level=high

  benchmark:
    name: Benchmark sanity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Not a performance gate: shared runners are too noisy for that. This
      # proves the benchmarks still run and that no corpus document, including
      # the adversarial ones, crashes or hangs the checker.
      - name: Every benchmark document completes
        run: node bench/guard.mjs
